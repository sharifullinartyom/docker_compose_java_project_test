services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app42db
      MYSQL_USER: app42user
      MYSQL_PASSWORD: app42password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword || mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s


volumes:
  dbdata: